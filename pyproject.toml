[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talm"
version = "0.1.0"
description = "TALM: Tree-Structured Multi-Agent Framework with Long-Term Memory for Code Generation"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "google-generativeai>=0.8.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "sentence-transformers>=3.0.0",
    "zvec>=0.2.0",
    "chromadb>=0.5.0",
]

[project.scripts]
talm-server = "talm.server:main"

[tool.setuptools.packages.find]
where = ["src"]
